name: CI - Pull Request Checks

on:
  pull_request:
    branches:
      - staging

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run tests
        run: npm run test --if-present

      - name: Build app
        run: npm run build

      - name: Display Output
        run: echo "Deployment to Staging"

